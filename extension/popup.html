<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سحب المواد المطروحة</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="header">
        <img src="icons/icon48.png" alt="" width="32" height="32">
        <div>
            <h1>سحب المواد المطروحة</h1>
            <p class="subtitle">مولد الجداول الذكي — الإصدار <span id="version"></span></p>
        </div>
    </header>

    <main class="body">
        <p class="hint" id="hint">
            افتح صفحة <strong>المقررات المطروحة وفق الخطة</strong> واضغط "ابدأ السحب".
            ثم افتح صفحة <strong>المقررات المسجلة</strong> واضغط الزر مرة أخرى لجلب شعبك الحالية.
        </p>

        <div class="progress" id="progress" hidden>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <p class="progress-text" id="progressText"></p>
        </div>

        <p class="status" id="status" hidden></p>

        <div class="collected" id="collected" hidden></div>

        <div class="actions">
            <button class="btn btn-primary" id="startBtn">ابدأ السحب</button>
            <button class="btn btn-danger" id="cancelBtn" hidden>إيقاف</button>
            <button class="btn btn-secondary" id="openBtn" hidden>افتح الموقع بالبيانات</button>
            <button class="btn btn-ghost" id="clearBtn" hidden>مسح البيانات المحفوظة</button>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
